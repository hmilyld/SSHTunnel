# cargo-deny 配置：只保留本仓库实际启用的策略。
# 运行：cd src-tauri && cargo deny check

[advisories]
ignore = [
    # chrono 仅用于本地时间戳格式化，不处理不可信输入；迁移到维护中的时间库另立任务。
    { id = "RUSTSEC-2026-0543", reason = "chrono is used only for local timestamp formatting; no untrusted input. Migration tracked in CHANGELOG." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Tauri 依赖树中允许存在同一 crate 的多个版本；升级策略由 Dependabot + 人工 review 负责。
multiple-versions = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
