[package]
name = "ssh-tunnel-manager"
version = "1.1.0"
description = "跨平台 SSH 本地端口转发（ssh -L）管理器"
authors = ["hmilyld <https://hmilyld.com>"]
license = "MIT"
homepage = "https://hmilyld.com"
repository = "https://github.com/hmilyld/SSHTunnel"
edition = "2021"
rust-version = "1.90"

[lib]
name = "ssh_tunnel_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread", "net"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-single-instance = "2"
glob = "0.3"
jiff = "1.0"

# Unix（macOS）侧：libc::kill 用于进程存活检测与信号发送
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
