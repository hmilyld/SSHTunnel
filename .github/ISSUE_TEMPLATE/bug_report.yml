name: Bug report
description: 报告可复现的问题（请先移除密码、密钥、令牌等敏感信息）
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 Issue，并**不要**粘贴密码、私钥、token、
        完整的 `tunnels.json` 或 `~/.ssh/config`。安全漏洞请走私密渠道，见 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: "例如 1.0.2"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 10
        - Windows 11
        - macOS 12+
        - 其他
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - NSIS setup.exe
        - MSI
        - DMG
        - pnpm tauri dev
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量给出最小、稳定的步骤
      placeholder: |
        1. 打开...
        2. 选择 Host...
        3. 点击...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图（已脱敏）
      description: Windows 日志在 %APPDATA%\ssh-tunnel-manager\app.log；macOS 在 ~/Library/Application Support/ssh-tunnel-manager/app.log
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue
          required: true
        - label: 我已移除密码、密钥、令牌和完整配置文件
          required: true
