name: Feature request
description: 提出功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请说明使用场景与期望行为，避免只描述实现方式。安全相关问题请走私密渠道。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不方便？影响了什么场景？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望应用如何表现？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 已尝试的做法
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 隧道生命周期
        - SSH 认证 / 密码
        - 界面 / 交互
        - 托盘 / 窗口
        - 发布 / CI
        - 文档
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue
          required: true
        - label: 这不是安全漏洞（安全漏洞走私密渠道）
          required: true
